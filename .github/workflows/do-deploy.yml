name: Deploy to DigitalOcean WordPress pool

# Reusable deploy for sites hosted on the DigitalOcean WordPress droplet pool
# (release layout under /var/www/<site>: releases/<sha>, current symlink,
# shared/uploads, shared/wp-config.php, optional shared/wp-content/*). Called from each site repo on push
# to stage (stage droplet) and main (prod droplet).

on:
  workflow_call:
    inputs:
      site:
        description: 'Site slug on the pool (directory under /var/www, PHP-FPM user wp-<site>)'
        required: true
        type: string
      environment:
        description: 'GitHub environment name (stage or production)'
        required: true
        type: string
      host:
        description: 'Droplet hostname or IP to deploy to'
        required: true
        type: string
      url:
        description: 'Public URL shown on the environment'
        required: false
        type: string
        default: ''
      keep_releases:
        description: 'Number of releases to keep on the droplet'
        required: false
        type: number
        default: 5
      firewall_id:
        description: 'DigitalOcean cloud firewall id guarding the droplet. When set, the runner IP is allowed on port 22 for the duration of the job and revoked afterwards.'
        required: false
        type: string
        default: ''
    secrets:
      DEPLOY_SSH_KEY:
        description: 'Private key for the deploy user on the droplet'
        required: true
      DO_FIREWALL_TOKEN:
        description: 'DigitalOcean API token scoped to firewall updates (required when firewall_id is set)'
        required: false

concurrency:
  group: do-deploy-${{ inputs.site }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.site }} -> ${{ inputs.environment }} (${{ inputs.host }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    env:
      SITE: ${{ inputs.site }}
      HOST: ${{ inputs.host }}
      ROOT: /var/www/${{ inputs.site }}
      RELEASE: ${{ github.sha }}
      KEEP: ${{ inputs.keep_releases }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Allow this runner through the cloud firewall
        if: inputs.firewall_id != ''
        id: fw
        env:
          DO_TOKEN: ${{ secrets.DO_FIREWALL_TOKEN }}
          FW: ${{ inputs.firewall_id }}
        run: |
          [ -n "$DO_TOKEN" ] || { echo "::error::firewall_id is set but the DO_FIREWALL_TOKEN secret is empty"; exit 1; }
          ip=$(curl -fsS --max-time 15 https://api.ipify.org || curl -fsS --max-time 15 https://ifconfig.me)
          echo "runner_ip=$ip" >> "$GITHUB_OUTPUT"
          body=$(printf '{"inbound_rules":[{"protocol":"tcp","ports":"22","sources":{"addresses":["%s/32"]}}]}' "$ip")
          code=$(curl -sS -o /tmp/fw.out -w '%{http_code}' -X POST -H "Authorization: Bearer $DO_TOKEN" -H 'Content-Type: application/json' \
                 "https://api.digitalocean.com/v2/firewalls/$FW/rules" -d "$body")
          [ "$code" = 204 ] || { echo "::error::firewall rule add failed ($code): $(cat /tmp/fw.out)"; exit 1; }
          echo "allowed $ip/32 on 22 (firewall $FW)"
          sleep 5

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<CFG
          Host target
            HostName $HOST
            User deploy
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 20
            ServerAliveInterval 30
          CFG
          if ! ssh target true; then
            echo "::error::cannot reach deploy@$HOST over SSH (firewall, key, or host down)"; exit 1
          fi

      - name: Preflight on the droplet
        run: |
          ssh target "test -d $ROOT/releases && test -d $ROOT/shared/uploads && test -f $ROOT/shared/wp-config.php" \
            || { echo "::error::$ROOT is not a pool site layout (releases/, shared/uploads, shared/wp-config.php)"; exit 1; }

      - name: Upload release
        run: |
          rsync -az --delete \
            --exclude='.git/' --exclude='.github/' --exclude='.gitignore' --exclude='README.md' \
            --exclude='wp-content/uploads/' --exclude='wp-content/cache/' --exclude='wp-config.php' \
            --link-dest="$ROOT/current/" \
            ./ "target:$ROOT/releases/$RELEASE/"

      - name: Link shared files and activate
        run: |
          # Step env vars live on the runner only; hand them to the remote shell explicitly.
          ssh target "SITE='$SITE' ROOT='$ROOT' RELEASE='$RELEASE' KEEP='$KEEP' bash -s" <<'REMOTE'
          set -euo pipefail
          REL="${ROOT}/releases/${RELEASE}"
          rm -rf "$REL/wp-content/uploads"
          ln -sfn ../../../shared/uploads "$REL/wp-content/uploads"
          # Optional per-site runtime files that must survive deploys and stay out of git
          # (e.g. a page-cache drop-in, its cache dir, a plugin's credentials dir): every entry
          # in shared/wp-content/ replaces the same name in the release's wp-content.
          if [ -d "$ROOT/shared/wp-content" ]; then
            for src in "$ROOT"/shared/wp-content/* "$ROOT"/shared/wp-content/.[!.]*; do
              [ -e "$src" ] || continue
              name=$(basename "$src")
              [ "$name" = uploads ] && continue  # uploads is always linked from shared/uploads above
              rm -rf "$REL/wp-content/$name"
              ln -sfn "../../../shared/wp-content/$name" "$REL/wp-content/$name"
              echo "linked shared/wp-content/$name"
            done
          fi
          # shared/wp-config.php is owned by the site's PHP user (mode 640), so copy it with sudo
          sudo -n cp "$ROOT/shared/wp-config.php" "$REL/wp-config.php"
          sudo -n chown -R "wp-${SITE}:wp-${SITE}" "$REL"
          sudo -n chmod 640 "$REL/wp-config.php"
          ln -sfn "releases/${RELEASE}" "$ROOT/current.tmp" && mv -Tf "$ROOT/current.tmp" "$ROOT/current"
          sudo -n -u "wp-${SITE}" wp --path="$ROOT/current" core is-installed --skip-plugins --skip-themes >/dev/null
          sudo -n -u "wp-${SITE}" wp --path="$ROOT/current" cache flush --skip-plugins --skip-themes >/dev/null 2>&1 || true
          sudo -n systemctl reload "php8.3-fpm"
          # prune old releases, keep the newest $KEEP
          ls -1dt "$ROOT"/releases/*/ | tail -n +$((KEEP + 1)) | xargs -r rm -rf
          echo "activated $REL"
          REMOTE
        env:
          SITE: ${{ env.SITE }}
          ROOT: ${{ env.ROOT }}
          RELEASE: ${{ env.RELEASE }}
          KEEP: ${{ env.KEEP }}

      - name: Smoke test
        if: inputs.url != ''
        run: |
          host=$(echo "${{ inputs.url }}" | sed -E 's#https?://##; s#/.*##')
          code=$(curl -sk -o /dev/null -w '%{http_code}' --resolve "$host:443:$HOST" -A 'Mozilla/5.0 (deploy smoke test)' "https://$host/")
          echo "https://$host/ via $HOST -> $code"
          case "$code" in 200|301|302) ;; *) echo "::error::unexpected status $code"; exit 1;; esac

      - name: Revoke this runner from the cloud firewall
        if: always() && inputs.firewall_id != '' && steps.fw.outputs.runner_ip != ''
        env:
          DO_TOKEN: ${{ secrets.DO_FIREWALL_TOKEN }}
          FW: ${{ inputs.firewall_id }}
          IP: ${{ steps.fw.outputs.runner_ip }}
        run: |
          body=$(printf '{"inbound_rules":[{"protocol":"tcp","ports":"22","sources":{"addresses":["%s/32"]}}]}' "$IP")
          code=$(curl -sS -o /tmp/fw.out -w '%{http_code}' -X DELETE -H "Authorization: Bearer $DO_TOKEN" -H 'Content-Type: application/json' \
                 "https://api.digitalocean.com/v2/firewalls/$FW/rules" -d "$body")
          [ "$code" = 204 ] && echo "revoked $IP/32" || { echo "::warning::firewall rule removal returned $code: $(cat /tmp/fw.out)"; }
