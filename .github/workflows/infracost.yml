name: Infracost

on:
  workflow_call:
    inputs:
      terraform_dir:
        description: 'Directory containing Terraform files'
        type: string
        default: 'terraform'
      tfvars_file:
        description: '.tfvars file path relative to repo root (e.g. terraform/prod.tfvars)'
        type: string
        default: 'terraform/prod.tfvars'
    secrets:
      INFRACOST_API_KEY:
        required: true

jobs:
  infracost:
    name: Infracost Cost Estimate
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Run Infracost breakdown
        env:
          TF_DIR: ${{ inputs.terraform_dir }}
          TFVARS: ${{ inputs.tfvars_file }}
        run: |
          # tfvars_file is documented as relative to the repo root, but Infracost
          # resolves --terraform-var-file relative to --path. Convert it, and pass
          # the value through unchanged if it is already relative to terraform_dir.
          if [ -f "$TFVARS" ]; then
            VAR_FILE="$(realpath --relative-to="$TF_DIR" "$TFVARS")"
          else
            VAR_FILE="$TFVARS"
          fi
          echo "Infracost var file (relative to $TF_DIR): $VAR_FILE"
          infracost breakdown \
            --path "$TF_DIR" \
            --terraform-var-file "$VAR_FILE" \
            --format json \
            --out-file /tmp/infracost.json

      - name: Post Infracost comment
        run: |
          infracost comment github \
            --path /tmp/infracost.json \
            --repo $GITHUB_REPOSITORY \
            --pull-request ${{ github.event.pull_request.number }} \
            --github-token ${{ github.token }} \
            --behavior update

