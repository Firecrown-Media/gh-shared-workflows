name: Reverse Sync from VIP

on:
  workflow_call:
    inputs:
      source_repo:
        description: 'VIP repo to check (e.g. wpcomvip/astronomy-com)'
        required: true
        type: string
      source_branch:
        description: 'VIP branch to check (e.g. production)'
        required: true
        type: string
      target_branch:
        description: 'Branch in the calling repo to target for the PR'
        required: false
        type: string
        default: 'main'

jobs:
  reverse-sync:
    name: Check ${{ inputs.source_repo }}@${{ inputs.source_branch }} for hotfixes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup SSH deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VIP_DEPLOY_TOKEN }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Add VIP remote and fetch
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/deploy_key
        run: |
          git remote add vip "git@github.com:${{ inputs.source_repo }}.git"
          git fetch vip ${{ inputs.source_branch }}

      - name: Check for divergence
        id: divergence
        run: |
          # Emit each commit as: SHA|author|subject. Pipe-separated so we can match
          # author+subject jointly with a single fixed-string grep without regex
          # escaping for the [bot] brackets in the author name.
          ALL=$(git log HEAD..vip/${{ inputs.source_branch }} --pretty=format:'%H|%an|%s')

          # Drop the vip-sync artifact-wrapper commits. The filter requires BOTH:
          #   author == github-actions[bot]
          #   message begins with "ci: build deploy artifacts"
          # Using fixed-string match (-F) against the literal "|author|message-prefix"
          # fragment that appears at the author/message boundary of the pretty
          # format. If vip-sync.yml ever changes its commit message, update this
          # filter to match.
          FILTERED=$(echo "$ALL" | grep -vF '|github-actions[bot]|ci: build deploy artifacts' || true)

          # Convert back to the `--oneline`-style output the rest of the workflow
          # expects (7-char SHA + space + subject, one commit per line).
          COMMITS=$(echo "$FILTERED" | awk -F'|' 'NF>=3 {printf "%s %s\n", substr($1,1,7), $3}')

          if [ -z "$COMMITS" ]; then
            echo "VIP is in sync — nothing to do (after filtering artifact wrappers)."
            echo "has_divergence=false" >> $GITHUB_OUTPUT
          else
            echo "VIP has commits not in ${{ inputs.target_branch }}:"
            echo "$COMMITS"
            echo "has_divergence=true" >> $GITHUB_OUTPUT
            echo "commits<<EOF" >> $GITHUB_OUTPUT
            echo "$COMMITS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Check for existing hotfix PR
        id: existing_pr
        if: steps.divergence.outputs.has_divergence == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --label vip-hotfix --state open --json number,headRefName,url --jq '.[0]')
          if [ -n "$PR" ]; then
            PR_NUMBER=$(echo "$PR" | jq -r '.number')
            PR_BRANCH=$(echo "$PR" | jq -r '.headRefName')
            PR_URL=$(echo "$PR" | jq -r '.url')
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "pr_branch=$PR_BRANCH" >> $GITHUB_OUTPUT
            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Ensure vip-hotfix label exists
        if: steps.divergence.outputs.has_divergence == 'true' && steps.existing_pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create vip-hotfix \
            --color FF6B35 \
            --description "Reverse-sync PR from VIP — review and promote down to stage/develop" \
            2>/dev/null || true

      - name: Create hotfix branch (no open PR)
        id: create_hotfix
        if: steps.divergence.outputs.has_divergence == 'true' && steps.existing_pr.outputs.exists == 'false'
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/deploy_key
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Move ${{ ... }} interpolations into env vars so the shell sees them
          # via $VAR expansion (which does NOT re-parse the value). Direct
          # ${{ ... }} substitution into a "$BODY" string would break when commit
          # messages contain shell-special characters like `"` or `(`.
          SOURCE_REF: ${{ inputs.source_repo }}:${{ inputs.source_branch }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          COMMITS: ${{ steps.divergence.outputs.commits }}
        run: |
          BRANCH="vip-hotfix/$(date +'%Y-%m-%d')"
          git checkout -b "$BRANCH" "vip/$SOURCE_BRANCH"
          git push origin "$BRANCH"
          BODY=$(cat <<EOF
          ## VIP Hotfix Reverse Sync

          Commits found on \`$SOURCE_REF\` that are not in \`$TARGET_BRANCH\`:

          \`\`\`
          $COMMITS
          \`\`\`

          ## After merging this PR

          Propagate the hotfix to all branches:

          \`\`\`bash
          # Merge main into stage
          git checkout stage && git merge main && git push

          # Merge stage into develop
          git checkout develop && git merge stage && git push
          \`\`\`

          Alternatively, cherry-pick only the hotfix commits if you do not want to cascade unrelated changes from main.

          > This PR was opened automatically by the VIP reverse sync workflow.
          EOF
          )
          PR_URL=$(gh pr create \
            --title "chore: reverse sync VIP hotfix to $TARGET_BRANCH" \
            --base "$TARGET_BRANCH" \
            --head "$BRANCH" \
            --label "vip-hotfix" \
            --body "$BODY")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Notify Slack — hotfix PR opened
        if: steps.divergence.outputs.has_divergence == 'true' && steps.existing_pr.outputs.exists == 'false' && env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_VIP_PIPELINES_WEBHOOK }}
          # All ${{ ... }} values that appear in the jq input come through env
          # vars and `--arg`, which safely embeds them as JSON strings even when
          # they contain `"`, `(`, backticks, etc.
          REPO_NAME: ${{ github.event.repository.name }}
          PR_URL_INPUT: ${{ steps.create_hotfix.outputs.pr_url }}
          COMMITS: ${{ steps.divergence.outputs.commits }}
          ACTOR: ${{ github.actor }}
          SOURCE_REF: ${{ inputs.source_repo }}:${{ inputs.source_branch }}
          RUN_URL_INPUT: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          COUNT=$(echo "$COMMITS" | wc -l | tr -d ' ')
          PAYLOAD=$(jq -n \
            --arg repo "$REPO_NAME" \
            --arg pr "$PR_URL_INPUT" \
            --arg commits "$COMMITS" \
            --arg count "$COUNT" \
            --arg actor "$ACTOR" \
            --arg source "$SOURCE_REF" \
            --arg run_url "$RUN_URL_INPUT" \
            --arg run_num "$RUN_NUM" \
            '{
              text: "🔄 \($repo) — VIP hotfix PR opened",
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: "🔄 *\($repo)* — VIP hotfix PR opened" } },
                { type: "section", text: { type: "mrkdwn", text: "\($count) commit(s) from `\($source)` · triggered by @\($actor)" } },
                { type: "rich_text", elements: [ { type: "rich_text_preformatted", elements: [ { type: "text", text: $commits } ] } ] },
                { type: "context", elements: [ { type: "mrkdwn", text: "<\($pr)|view PR> · <\($run_url)|view run>" } ] }
              ]
            }')
          curl -fsS -X POST -H 'content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"

      - name: Update existing hotfix branch (open PR exists)
        if: steps.divergence.outputs.has_divergence == 'true' && steps.existing_pr.outputs.exists == 'true'
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/deploy_key
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # See "Create hotfix branch" step for why these are env vars rather
          # than direct ${{ ... }} interpolations into the shell.
          PR_NUMBER: ${{ steps.existing_pr.outputs.pr_number }}
          PR_BRANCH: ${{ steps.existing_pr.outputs.pr_branch }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          COMMITS: ${{ steps.divergence.outputs.commits }}
        run: |
          git push origin "vip/$SOURCE_BRANCH:refs/heads/$PR_BRANCH" --force-with-lease
          BODY=$(cat <<EOF
          VIP has new commits not yet in \`$TARGET_BRANCH\`. This branch has been updated to include them:

          \`\`\`
          $COMMITS
          \`\`\`
          EOF
          )
          gh pr comment "$PR_NUMBER" --body "$BODY"

      - name: Notify Slack — hotfix PR updated
        if: steps.divergence.outputs.has_divergence == 'true' && steps.existing_pr.outputs.exists == 'true' && env.SLACK_WEBHOOK_URL != ''
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_VIP_PIPELINES_WEBHOOK }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_URL_INPUT: ${{ steps.existing_pr.outputs.pr_url }}
          COMMITS: ${{ steps.divergence.outputs.commits }}
          ACTOR: ${{ github.actor }}
          RUN_URL_INPUT: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          PAYLOAD=$(jq -n \
            --arg repo "$REPO_NAME" \
            --arg pr "$PR_URL_INPUT" \
            --arg commits "$COMMITS" \
            --arg actor "$ACTOR" \
            --arg run_url "$RUN_URL_INPUT" \
            --arg run_num "$RUN_NUM" \
            '{
              text: "🔄 \($repo) — existing hotfix PR updated",
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: "🔄 *\($repo)* — existing hotfix PR updated with new VIP commits" } },
                { type: "section", text: { type: "mrkdwn", text: "triggered by @\($actor)" } },
                { type: "rich_text", elements: [ { type: "rich_text_preformatted", elements: [ { type: "text", text: $commits } ] } ] },
                { type: "context", elements: [ { type: "mrkdwn", text: "<\($pr)|view PR> · <\($run_url)|view run>" } ] }
              ]
            }')
          curl -fsS -X POST -H 'content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
