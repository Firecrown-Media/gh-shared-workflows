name: PHP Code Standards

on:
  workflow_call:
    inputs:
      php_version:
        description: PHP version to use
        required: false
        type: string
        default: '8.2'
      scan_mode:
        description: "'delta' scans changed files only; 'full' scans entire repo and opens an issue"
        required: false
        type: string
        default: 'delta'
      lint_vendored_plugins:
        description: "Lint plugins/<dir>/ trees that a commit in the delta range declares third-party with a 'Plugin-Vendored: plugins/<dir>/' trailer: a new install, or an update whose files match the wordpress.org release in its 'Plugin-Upstream: wporg:<slug>@<version>' trailer (wpvip-fleet ADR-024, ADR-025). Default false: those files are skipped, with a notice."
        required: false
        type: boolean
        default: false

jobs:
  phpcs:
    name: PHP_CodeSniffer
    runs-on: ubuntu-latest
    if: vars.ENABLE_PHPCS != 'false'
    permissions:
      issues: write
      contents: read

    # Private-package Composer auth via an ORG-OWNED GitHub App. This block is a
    # straight port of the one added to security-scan.yml on 2026-07-08 (5cf95fc)
    # and never applied to this sibling — `composer require` re-resolves the whole
    # dependency tree, so on a site whose composer.json declares the private
    # Firecrown-Media/firecrown-kserv package it dies cloning it ("Invalid username
    # or token") long before it sniffs anything. Needs the caller to forward
    # `secrets: inherit`; absent, the two steps below skip and behaviour is exactly
    # what it is today.
    env:
      COMPOSER_APP_ID: ${{ secrets.COMPOSER_APP_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP ${{ inputs.php_version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          tools: composer, cs2pr

      - name: Mint Composer auth token (GitHub App)
        id: composer_auth
        if: ${{ env.COMPOSER_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.COMPOSER_APP_ID }}
          private-key: ${{ secrets.COMPOSER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Configure Composer auth for private packages
        if: ${{ steps.composer_auth.outputs.token != '' }}
        run: composer config --global github-oauth.github.com "${{ steps.composer_auth.outputs.token }}"

      # Composer will not run a plugin it has not been told to trust, and under
      # --no-interaction it ABORTS rather than prompting. The `lean` sites have no
      # composer.json at all, so there is no allow-plugins block to inherit and the
      # require below has failed on every run those repos have ever had.
      #
      # --global is load-bearing, not tidiness: a repo-scoped `composer config`
      # exits 1 with "File ./composer.json cannot be found in the current
      # directory" on exactly the sites this is meant to fix. It also keeps CI from
      # editing a site's committed composer.json. Verified locally against a bare
      # directory, before and after.
      - name: Trust the PHPCS standards installer
        run: composer config --no-plugins --global allow-plugins.dealerdirect/phpcodesniffer-composer-installer true

      # --no-scripts: `composer require` resolves the caller's own
      # composer.json, and without the flag it runs that file's scripts
      # (post-update-cmd, post-autoload-dump, ...), which is code from the
      # commit under scan, able to rewrite HOME, $GITHUB_ENV or $GITHUB_PATH
      # for every later step. No site's composer.json defines scripts. The
      # standards installer is a Composer plugin, not a script, and still
      # runs. What this does not close: a Composer plugin that the caller's
      # composer.json requires and allows, and the caller's own ruleset. A
      # green scan is only as trustworthy as those two files.
      - name: Install PHPCS and VIP ruleset
        run: |
          composer require --dev \
            automattic/vipwpcs:^3 \
            dealerdirect/phpcodesniffer-composer-installer \
            --no-interaction --no-progress --no-scripts

      # A repo with no ruleset file gets phpcs's built-in default (PEAR), which on
      # WordPress code produces a flood of irrelevant findings. Naming the VIP
      # standard explicitly is the difference between "the scan works" and "the
      # failure moved". A site that ships a ruleset keeps using its own — phpcs
      # auto-discovers it, and passing --standard would override it.
      - name: Resolve the PHPCS standard
        id: standard
        run: |
          RULESET=""
          for f in .phpcs.xml.dist .phpcs.xml phpcs.xml.dist phpcs.xml; do
            if [ -f "$f" ]; then RULESET="$f"; break; fi
          done
          if [ -n "$RULESET" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "ruleset=repo" >> "$GITHUB_OUTPUT"
            echo "Using this repository's own ruleset: $RULESET"
          else
            echo "args=--standard=WordPress-VIP-Go" >> "$GITHUB_OUTPUT"
            echo "ruleset=fallback" >> "$GITHUB_OUTPUT"
            echo "No ruleset in this repo — falling back to WordPress-VIP-Go."
          fi

      # The checksum verifier for PHPCS_VENDORED_SKIP v2's update rule (see the
      # delta scan). It prints one line, and exits 0 only on an exact match;
      # anything else, a crash included, keeps the files linted.
      #
      # A step of its own since the first v2 probe: the delta scan's script
      # then held a GitHub expression, so GitHub compiled all of it into one
      # expression, capped at 21,000 characters with braces and quotes
      # doubled, and the verifier took it over the cap. That script now holds
      # no expression (see its env:), so the cap no longer applies to it.
      # The verifier is written to $RUNNER_TEMP, outside the checkout, after
      # Composer. That is not a trust boundary: code the caller's
      # composer.json brings in can still change every later step (see the
      # Install step).
      #
      # python3 (ubuntu-latest ships it) rather than jq (it ships that too),
      # because the work is more than parsing: compare a file set and a sha256
      # per file, where the value is a string or a list. python3 does all of it
      # in one process, over NUL-delimited `git ls-tree -z` and a single
      # `git cat-file --batch`. With jq the hashing and the set comparison
      # would fall to bash: a fork per file (jetpack ships 2,900) and names
      # split on newlines.
      - name: Stage the vendored-update checksum verifier
        if: inputs.scan_mode == 'delta'
        run: |
          if ! cat > "$RUNNER_TEMP/phpcs-vendored-verify.py" <<'PHPCS_VERIFY_PY'
          import hashlib
          import json
          import subprocess
          import sys
          import threading


          # ASCII escapes, so two names that differ only in Unicode
          # normalisation (NFC "caf\u00e9", NFD "cafe\u0301") print differently.
          def show(name):
              text = json.dumps(name, ensure_ascii=True)
              return text if len(text) <= 120 else text[:117] + '..."'


          def some(names):
              if not names:
                  return ""
              more = " and %d more" % (len(names) - 3) if len(names) > 3 else ""
              return " (" + ", ".join(show(n) for n in names[:3]) + more + ")"


          def verify(head, vdir, slug, version, path):
              try:
                  with open(path, "rb") as f:
                      data = json.loads(f.read().decode("utf-8"))
              except (OSError, ValueError):
                  return "the checksums response is not JSON", 0
              files = data.get("files") if isinstance(data, dict) else None
              if not isinstance(files, dict) or not files:
                  return "the checksums response lists no files", 0
              if data.get("plugin") != slug or data.get("version") != version:
                  return ("the checksums response is for %s %s"
                          % (show(data.get("plugin")), show(data.get("version")))), 0
              prefix = (vdir + "/").encode("utf-8")
              ls = subprocess.run(["git", "ls-tree", "-r", "-z", "--full-tree", head, "--", vdir + "/"],
                                  stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
                                  stderr=subprocess.DEVNULL, timeout=300)
              if ls.returncode != 0:
                  return "git ls-tree could not list it at " + head, 0
              blobs = {}
              for rec in ls.stdout.split(b"\0"):
                  if not rec:
                      continue
                  meta, _, name = rec.partition(b"\t")
                  parts = meta.split(b" ")
                  if len(parts) != 3 or not name.startswith(prefix):
                      return "git ls-tree printed an unexpected entry", 0
                  mode, kind, sha = parts
                  try:
                      rel = name[len(prefix):].decode("utf-8")
                  except UnicodeDecodeError:
                      return "a file name in it is not UTF-8", 0
                  if kind != b"blob" or mode not in (b"100644", b"100755"):
                      return ("%s is not a regular file (mode %s)"
                              % (show(rel), mode.decode("ascii", "replace"))), 0
                  blobs[rel] = sha
              missing = sorted(set(files) - set(blobs))
              extra = sorted(set(blobs) - set(files))
              if missing or extra:
                  return ("its files are not the release's: %d missing%s, %d extra%s"
                          % (len(missing), some(missing), len(extra), some(extra))), 0
              cat = subprocess.Popen(["git", "cat-file", "--batch"], stdin=subprocess.PIPE,
                                     stdout=subprocess.PIPE, stderr=subprocess.DEVNULL)
              differ = []

              def hash_all():
                  for rel in sorted(blobs):
                      entry = files[rel]
                      want = entry.get("sha256") if isinstance(entry, dict) else None
                      if isinstance(want, str):
                          want = [want]
                      if not isinstance(want, list) or not want or not all(isinstance(w, str) for w in want):
                          return "the release gives no sha256 for " + show(rel)
                      cat.stdin.write(blobs[rel] + b"\n")
                      cat.stdin.flush()
                      header = cat.stdout.readline().split()
                      if len(header) != 3 or header[1] != b"blob":
                          return "git cat-file could not read " + show(rel)
                      size = int(header[2])
                      body = cat.stdout.read(size)
                      if len(body) != size or cat.stdout.read(1) != b"\n":
                          return "git cat-file returned a short read for " + show(rel)
                      if hashlib.sha256(body).hexdigest() not in [w.lower() for w in want]:
                          differ.append(rel)
                  return ""

              # The same 300 s as ls-tree, so a wedged read cannot hold the
              # job to GitHub's 6-hour limit. A killed git reads as EOF.
              expired = threading.Event()

              def expire():
                  expired.set()
                  cat.kill()

              deadline = threading.Timer(300, expire)
              deadline.daemon = True
              deadline.start()
              try:
                  try:
                      reason = hash_all()
                  except OSError as e:
                      reason = "git cat-file stopped answering (%s)" % type(e).__name__
              finally:
                  deadline.cancel()
                  for stream in (cat.stdin, cat.stdout):
                      try:
                          stream.close()
                      except OSError:
                          pass
                  cat.wait()
              if reason:
                  if expired.is_set():
                      reason = "git cat-file did not finish within 300 s"
                  return reason, 0
              if differ:
                  return ("%d file(s) differ from the release%s" % (len(differ), some(differ))), 0
              return "", len(blobs)


          def main():
              if len(sys.argv) != 6:
                  print("the checksum verifier was called wrongly")
                  return 1
              try:
                  reason, count = verify(*sys.argv[1:6])
              except Exception as e:
                  reason, count = "the checksum verifier failed (%s)" % type(e).__name__, 0
              if reason:
                  print(reason)
                  return 1
              print("all %d file(s) match the wordpress.org release %s %s" % (count, sys.argv[3], sys.argv[4]))
              return 0


          sys.exit(main())
          PHPCS_VERIFY_PY
          then
            rm -f "$RUNNER_TEMP/phpcs-vendored-verify.py" || true
            echo "::warning::Could not write the checksum verifier, so no plugin update is skipped: every changed file of one is linted."
          fi

      - name: Run PHPCS delta scan
        if: inputs.scan_mode == 'delta'
        env:
          PHPCS_EVENT_NAME: ${{ github.event_name }}
          PHPCS_BASE_REF: ${{ github.base_ref }}
          PHPCS_BEFORE: ${{ github.event.before }}
          PHPCS_SHA: ${{ github.sha }}
          LINT_VENDORED_PLUGINS: ${{ inputs.lint_vendored_plugins }}
          PHPCS_STANDARD_ARGS: ${{ steps.standard.outputs.args }}
        # Every value reaches this script through env:, and the script holds no
        # GitHub expression. Keep it that way: one expression in a run: script
        # makes GitHub compile the whole script into a single expression,
        # capped at 21,000 characters with braces and quotes doubled, and past
        # the cap it refuses the workflow on every caller (no jobs, "a workflow
        # file issue"). actionlint does not check that.
        run: |
          # A delta scan needs a diff base. Without one there is nothing to
          # compare, and "No PHP or JS files changed" would claim a scan that
          # never happened.
          #   - pull_request: the base always exists (fetch-depth: 0), and a
          #     green result is used as evidence (wpvip-fleet ADR-024, gate
          #     G5i), so a base that will not resolve is an error.
          #   - push / workflow_dispatch with an empty or all-zeros `before`:
          #     no base exists by design (a manual run, or the first push of a
          #     branch). Warn, lint nothing, and exit 0 as before.
          #   - a non-zero `before` missing from this full clone: the branch's
          #     history was rewritten. An error.
          # The PR base is spelled as the full remote-tracking ref. A short
          # "origin/<base>" resolves refs/tags/ first, checkout fetches every
          # tag, and a pushed tag named origin/develop would silently become
          # the base: the delta, the range and the "absent on base" test.
          if [ "$PHPCS_EVENT_NAME" = "pull_request" ]; then
            SCAN_BASE="refs/remotes/origin/${PHPCS_BASE_REF}"
            SCAN_HEAD="HEAD"
            DIFF_RANGE=("${SCAN_BASE}...${SCAN_HEAD}")
          else
            SCAN_BASE="$PHPCS_BEFORE"
            SCAN_HEAD="$PHPCS_SHA"
            DIFF_RANGE=("$SCAN_BASE" "$SCAN_HEAD")
            if [ -z "${PHPCS_BEFORE//0/}" ]; then
              echo "::warning::No diff base: event.before is empty or all zeros ($PHPCS_EVENT_NAME: a manual run, or the first push of a branch), so the delta scan lints no file. Use scan_mode: full to scan the repository."
              exit 0
            fi
          fi
          for SCAN_REV in "$SCAN_BASE" "$SCAN_HEAD"; do
            if ! git rev-parse --verify -q "${SCAN_REV}^{commit}" > /dev/null; then
              echo "::error::The delta scan cannot resolve '$SCAN_REV' to a commit in this clone, so it lints no file. On a push, the branch's history was probably rewritten."
              exit 1
            fi
          done
          # core.quotePath=false prints non-ASCII names as they are. Quoted,
          # they end in '"', never match the filter below, and go unlinted.
          # The raw bytes need `LC_ALL=C grep -a`: in a UTF-8 locale, GNU grep
          # calls a name that is not valid UTF-8 binary and stops printing
          # matches from there on, which would drop every later file.
          if ! CHANGED=$(git -c core.quotePath=false diff --name-only --diff-filter=ACMRT "${DIFF_RANGE[@]}" --); then
            echo "::error::git diff ${DIFF_RANGE[*]} failed, so the delta scan lints no file."
            exit 1
          fi
          # git still quotes a name holding '"', '\' or a control character,
          # and phpcs trims a leading space off a listed name, so neither can
          # be handed to phpcs as itself. Fail instead of passing unlinted.
          UNLINTABLE=$(printf '%s\n' "$CHANGED" | LC_ALL=C grep -a -E '^(".*\.(php|js)"| .*\.(php|js))$' || true)
          if [ -n "$UNLINTABLE" ]; then
            echo "::error::The delta scan cannot pass these changed file(s) to phpcs by name (a double quote, backslash or control character, or a leading space), so it would not lint them. Rename them:"
            printf '%s\n' "$UNLINTABLE"
            exit 1
          fi
          FILES=$(printf '%s\n' "$CHANGED" | LC_ALL=C grep -a -E '\.(php|js)$' || true)

          # PHPCS_VENDORED_SKIP v2 — wpvip-fleet ADR-024/ADR-025
          #
          # A third-party plugin committed into plugins/<dir>/ is not ours to
          # lint, and without this the delta scan sniffs every file of it, so the
          # PR that installs or updates it goes red on a caller that is
          # otherwise green. garage/scripts/plugin-rollout.py marks such a
          # commit with trailers:
          #
          #   Plugin-Vendored: plugins/<dir>/
          #   Plugin-Upstream: wporg:<slug>@<version>     (updates only)
          #
          # Every Plugin-Vendored trailer must first pass all of these:
          #   - it is on a non-merge commit inside the scan range;
          #   - it names exactly one directory level, ^plugins/[A-Za-z0-9._-]+/$;
          #   - the directory is not first-party by name (fc-, fw-, firecrown-,
          #     kserv): those are always linted, with a warning;
          #   - every path that commit changes is inside that directory, so a
          #     trailer cannot vouch for anything else in its own commit;
          #   - at the scanned endpoint the directory is exactly the tree that
          #     commit wrote, so no other commit in the range changed it: not a
          #     trailer-less patch, not a `git mv` into it, not a merge.
          #
          # Then one of two rules decides.
          #
          # Install (v1): the directory does not exist on the scan base, and
          # that commit creates it (it is absent from the commit's parent), so
          # nothing an earlier commit put there rides along. Every skipped file
          # holds exactly the bytes the trailer commit added. New in v2: a
          # directory whose name differs only in case from one on the scan
          # base (plugins/Astronomy-Core/ beside plugins/astronomy-core/) is
          # not an install; the update rule decides it.
          #
          # Update (v2): the directory exists on the scan base or in the
          # commit's parent, or differs only in case from one on the base.
          # Being there already says nothing about what it is
          # (astronomy-core, nexus-analytics, ...), so the bytes have to prove
          # it. The trailer is honoured only when ALL of these also hold:
          #   - the commit carries exactly one Plugin-Upstream trailer,
          #     wporg:<slug>@<version>, whose <slug> is the directory name and
          #     whose <version> matches ^[0-9A-Za-z._-]+$;
          #   - wordpress.org serves checksums for that release,
          #     downloads.wordpress.org/plugin-checksums/<slug>/<version>.json,
          #     with HTTP 200 over https and no redirect followed;
          #   - the directory's files at the endpoint are exactly the files that
          #     release lists, no more and no fewer, and all regular files;
          #   - every file's sha256 matches the release's (a string, or a list
          #     when the tag was re-cut, where any member matches).
          # So every file the update rule skips is, byte for byte, a file of a
          # published wordpress.org release. A premium or other
          # non-wordpress.org update is linted.
          #
          # Any failure rejects the trailer with a warning naming the reason,
          # and the files under its directory are linted. A Plugin-Upstream
          # trailer without a Plugin-Vendored one vouches for nothing. Callers
          # set lint_vendored_plugins: true to lint vendored dirs anyway.
          #
          # Only the update rule checks what the bytes are. The install rule
          # takes the trailer at its word: a new directory whose own creating
          # commit carries it is skipped whatever it holds, first-party code
          # moved there under a new name included (plugins/astronomy-core/
          # deleted by one commit, its code re-added as plugins/astro-core/ by
          # the next). And an update is skipped when it is some wordpress.org
          # release of that slug. A trailer is a declaration, reviewed in the
          # PR like the rest of the commit.
          #
          # Written for `bash -e` with or without pipefail: no pipeline's status
          # is relied on, every call that can fail is inside an `if` or an `||`,
          # and a path is one line, so names with spaces survive.
          NL=$'\n'
          VENDORED_DIRS=()
          # The update rule's checksum verifier, written by the step before.
          VERIFY_PY="${RUNNER_TEMP:-}/phpcs-vendored-verify.py"
          if [ -z "${RUNNER_TEMP:-}" ] || [ ! -f "$VERIFY_PY" ]; then VERIFY_PY=""; fi
          # Both ends are verified commits by now, so FILES is the real delta.
          VENDORED_RANGE="${SCAN_BASE}..${SCAN_HEAD}"
          if ! VENDORED_COMMITS=$(git rev-list --no-merges "$VENDORED_RANGE" --); then
            echo "::warning::Could not list the commits in $VENDORED_RANGE, so no Plugin-Vendored trailer is honoured and every changed file is linted."
            VENDORED_COMMITS=""
          fi
          while IFS= read -r VC; do
            if [ -z "$VC" ]; then continue; fi
            VC_SHORT="${VC:0:12}"
            if ! VC_VALUES=$(git log -1 --format='%(trailers:key=Plugin-Vendored,valueonly,unfold)' "$VC" --); then
              echo "::warning::Could not read the trailers of $VC_SHORT; none of them are honoured."
              continue
            fi
            if [ -z "$VC_VALUES" ]; then
              # Said so, because the probe for it is otherwise silent.
              if VC_UP_ONLY=$(git log -1 --format='%(trailers:key=Plugin-Upstream,valueonly,unfold)' "$VC" --) && [ -n "${VC_UP_ONLY//[[:space:]]/}" ]; then
                echo "::warning::Plugin-Upstream on $VC_SHORT ignored: it counts only beside a Plugin-Vendored: plugins/<dir>/ trailer on the same commit. Still linting."
              fi
              continue
            fi
            if ! VC_PATHS=$(git diff-tree --no-commit-id -r --name-only --root "$VC" --); then
              VC_PATHS=""
            fi
            while IFS= read -r VV; do
              VV="${VV%$'\r'}"
              VV="${VV#"${VV%%[![:space:]]*}"}"
              VV="${VV%"${VV##*[![:space:]]}"}"
              if [ -z "$VV" ]; then continue; fi
              # ^plugins/[A-Za-z0-9._-]+/$, spelled out without ranges so no
              # locale can widen it; "." and ".." are refused as well.
              VN=""
              case "$VV" in
                plugins/*/) VN="${VV#plugins/}"; VN="${VN%/}" ;;
              esac
              case "$VN" in
                ""|.|..|*[!ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789._-]*)
                  echo "::warning::Plugin-Vendored value '$VV' on $VC_SHORT rejected: it must name exactly one directory, as plugins/<dir>/. Still linting."
                  continue
                  ;;
              esac
              VN_LOWER=$(printf '%s' "$VN" | tr 'ABCDEFGHIJKLMNOPQRSTUVWXYZ' 'abcdefghijklmnopqrstuvwxyz')
              case "$VN_LOWER" in
                fc-*|fw-*|firecrown-*|kserv*)
                  echo "::warning::Plugin-Vendored value '$VV' on $VC_SHORT: first-party dir declared vendored; still linting."
                  continue
                  ;;
              esac
              if [ -z "$VC_PATHS" ]; then
                echo "::warning::Plugin-Vendored value '$VV' on $VC_SHORT not honoured: could not list the paths that commit changes. Still linting."
                continue
              fi
              VC_OUTSIDE=""
              while IFS= read -r VP; do
                if [ -z "$VP" ]; then continue; fi
                # git C-quotes unusual names ("plugins/x/\303\251.php"); a
                # quoted path under $VV starts with a quote and then $VV.
                case "$VP" in
                  "$VV"*|"\"$VV"*) ;;
                  *) VC_OUTSIDE="$VP"; break ;;
                esac
              done <<< "$VC_PATHS"
              if [ -n "$VC_OUTSIDE" ]; then
                echo "::warning::Plugin-Vendored value '$VV' on $VC_SHORT not honoured: that commit also changes '$VC_OUTSIDE', outside $VV. Still linting."
                continue
              fi
              VDIR="${VV%/}"
              # New or existing? ls-tree prints nothing for an absent path and
              # fails only on a real error, and "could not tell" is neither: it
              # keeps the files linted.
              if ! VDIR_ON_BASE=$(git ls-tree --full-tree "$SCAN_BASE" -- "$VDIR"); then
                echo "::warning::Plugin-Vendored value '$VV' on $VC_SHORT not honoured: could not tell whether $VV exists on $SCAN_BASE. Still linting."
                continue
              fi
              # A root commit has no parent; a non-merge commit has at most one.
              if ! VC_PARENTS=$(git log -1 --format=%P "$VC" --); then
                echo "::warning::Plugin-Vendored value '$VV' on $VC_SHORT not honoured: could not read that commit's parent. Still linting."
                continue
              fi
              VDIR_BEFORE=""
              VDIR_UNKNOWN=""
              for VPARENT in $VC_PARENTS; do
                if ! VDIR_ON_PARENT=$(git ls-tree --full-tree "$VPARENT" -- "$VDIR"); then
                  VDIR_UNKNOWN=1
                elif [ -n "$VDIR_ON_PARENT" ]; then
                  VDIR_BEFORE=1
                fi
              done
              if [ -n "$VDIR_UNKNOWN" ]; then
                echo "::warning::Plugin-Vendored value '$VV' on $VC_SHORT not honoured: could not tell whether $VV exists before that commit. Still linting."
                continue
              fi
              # Nothing else changed it: at the endpoint it is the very tree the
              # trailer commit wrote. Both rules.
              if ! VDIR_OWN=$(git rev-parse --verify -q "${VC}:${VDIR}"); then VDIR_OWN=""; fi
              if ! VDIR_END=$(git rev-parse --verify -q "${SCAN_HEAD}:${VDIR}"); then VDIR_END=""; fi
              if [ -z "$VDIR_OWN" ] || [ "$VDIR_OWN" != "$VDIR_END" ]; then
                echo "::warning::Plugin-Vendored value '$VV' on $VC_SHORT not honoured: $VV at $SCAN_HEAD is not the tree that commit wrote, so another change in the range touches it. Still linting."
                continue
              fi
              # A new name that differs only in case from a directory on the
              # base goes to the update rule. Compared ASCII-only (LC_ALL=C),
              # as the name is ASCII.
              VDIR_TWIN=""
              if [ -z "$VDIR_ON_BASE" ] && [ -z "$VDIR_BEFORE" ]; then
                if ! VDIR_SIBLINGS=$(git -c core.quotePath=false ls-tree --name-only --full-tree "$SCAN_BASE" -- plugins/); then
                  echo "::warning::Plugin-Vendored value '$VV' on $VC_SHORT not honoured: could not list plugins/ on $SCAN_BASE to rule out a directory whose name differs only in case. Still linting."
                  continue
                fi
                VDIR_TWIN=$(printf '%s\n' "$VDIR_SIBLINGS" | LC_ALL=C grep -a -i -x -F -e "$VDIR" || true)
                VDIR_TWIN="${VDIR_TWIN%%"$NL"*}"
              fi
              if [ -n "$VDIR_ON_BASE" ] || [ -n "$VDIR_BEFORE" ] || [ -n "$VDIR_TWIN" ]; then
                # The update rule: the bytes must be a wordpress.org release.
                VU_WHERE="already exists on $SCAN_BASE"
                if [ -n "$VDIR_TWIN" ]; then
                  VU_WHERE="differs only in case from $VDIR_TWIN/ on $SCAN_BASE"
                elif [ -z "$VDIR_ON_BASE" ]; then
                  VU_WHERE="already exists before that commit"
                fi
                if ! VC_UPSTREAMS=$(git log -1 --format='%(trailers:key=Plugin-Upstream,valueonly,unfold)' "$VC" --); then
                  echo "::warning::Plugin-Vendored value '$VV' on $VC_SHORT not honoured: $VV $VU_WHERE, so this is an update, and its Plugin-Upstream trailer could not be read. Still linting."
                  continue
                fi
                VU=""
                VU_COUNT=0
                while IFS= read -r VUV; do
                  VUV="${VUV%$'\r'}"
                  VUV="${VUV#"${VUV%%[![:space:]]*}"}"
                  VUV="${VUV%"${VUV##*[![:space:]]}"}"
                  if [ -z "$VUV" ]; then continue; fi
                  VU_COUNT=$((VU_COUNT + 1))
                  VU="$VUV"
                done <<< "$VC_UPSTREAMS"
                if [ "$VU_COUNT" -eq 0 ]; then
                  echo "::warning::Plugin-Vendored value '$VV' on $VC_SHORT not honoured: $VV $VU_WHERE, so this is an update, and an update is skipped only with a Plugin-Upstream: wporg:$VN@<version> trailer whose checksums match. Still linting."
                  continue
                fi
                if [ "$VU_COUNT" -ne 1 ]; then
                  echo "::warning::Plugin-Vendored value '$VV' on $VC_SHORT not honoured: that commit carries $VU_COUNT Plugin-Upstream trailers, and an update needs exactly one. Still linting."
                  continue
                fi
                VU_VER=""
                case "$VU" in
                  "wporg:$VN@"*) VU_VER="${VU#"wporg:$VN@"}" ;;
                  wporg:*)
                    echo "::warning::Plugin-Vendored value '$VV' on $VC_SHORT not honoured: Plugin-Upstream '$VU' does not name $VN, and the slug must be the directory name. Still linting."
                    continue
                    ;;
                  *)
                    echo "::warning::Plugin-Vendored value '$VV' on $VC_SHORT not honoured: Plugin-Upstream '$VU' is not wporg:<slug>@<version>, and only a wordpress.org release can be verified. Still linting."
                    continue
                    ;;
                esac
                case "$VU_VER" in
                  ""|*[!ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789._-]*)
                    echo "::warning::Plugin-Vendored value '$VV' on $VC_SHORT not honoured: the version in Plugin-Upstream '$VU' must match ^[0-9A-Za-z._-]+\$. Still linting."
                    continue
                    ;;
                esac
                if [ -z "$VERIFY_PY" ]; then
                  echo "::warning::Plugin-Vendored value '$VV' on $VC_SHORT not honoured: the checksum verifier is missing, so no update can be verified. Still linting."
                  continue
                fi
                VU_URL="https://downloads.wordpress.org/plugin-checksums/${VN}/${VU_VER}.json"
                if ! VU_JSON=$(mktemp); then
                  echo "::warning::Plugin-Vendored value '$VV' on $VC_SHORT not honoured: no temporary file for the checksums. Still linting."
                  continue
                fi
                # -q first, so no ~/.curlrc (an earlier step can write HOME)
                # adds -L or anything else; https only; no redirect followed.
                # Only a 200 counts: -f fails on 4xx/5xx but passes a 3xx, and
                # its body would land in the file as the checksums.
                if ! VU_CODE=$(curl -q -fsS --proto '=https' --max-redirs 0 --max-time 20 -w '%{http_code}' -o "$VU_JSON" "$VU_URL" < /dev/null); then
                  rm -f "$VU_JSON"
                  echo "::warning::Plugin-Vendored value '$VV' on $VC_SHORT not honoured: $VU_URL could not be fetched, so $VN $VU_VER is not a wordpress.org release this scan can verify. Still linting."
                  continue
                fi
                if [ "$VU_CODE" != "200" ]; then
                  rm -f "$VU_JSON"
                  echo "::warning::Plugin-Vendored value '$VV' on $VC_SHORT not honoured: $VU_URL answered HTTP ${VU_CODE:-(no status)}, not 200, so $VN $VU_VER is not a wordpress.org release this scan can verify. Still linting."
                  continue
                fi
                if ! VU_RESULT=$(python3 "$VERIFY_PY" "$SCAN_HEAD" "$VDIR" "$VN" "$VU_VER" "$VU_JSON" < /dev/null); then
                  rm -f "$VU_JSON"
                  echo "::warning::Plugin-Vendored value '$VV' on $VC_SHORT not honoured: $VV is not the wordpress.org release $VN $VU_VER: ${VU_RESULT:-the checksum verifier did not run}. Still linting."
                  continue
                fi
                rm -f "$VU_JSON"
                echo "::notice::Plugin-Vendored value '$VV' on $VC_SHORT honoured as an update: $VU_RESULT."
              fi
              VD_SEEN=""
              for VD in "${VENDORED_DIRS[@]}"; do
                if [ "$VD" = "$VV" ]; then VD_SEEN=1; fi
              done
              if [ -z "$VD_SEEN" ]; then VENDORED_DIRS+=("$VV"); fi
            done <<< "$VC_VALUES"
          done <<< "$VENDORED_COMMITS"
          if [ "${#VENDORED_DIRS[@]}" -gt 0 ]; then
            VENDORED_LIST=""
            for VD in "${VENDORED_DIRS[@]}"; do
              VENDORED_LIST="${VENDORED_LIST:+$VENDORED_LIST, }$VD"
            done
            if [ "$LINT_VENDORED_PLUGINS" = "true" ]; then
              echo "::notice::lint_vendored_plugins is true, so vendored plugin dir(s) are linted anyway: $VENDORED_LIST"
            else
              VENDORED_KEPT=""
              VENDORED_SKIPPED=0
              while IFS= read -r VF; do
                if [ -z "$VF" ]; then continue; fi
                VF_DROP=""
                for VD in "${VENDORED_DIRS[@]}"; do
                  case "$VF" in
                    "$VD"*|"\"$VD"*) VF_DROP=1 ;;
                  esac
                done
                if [ -n "$VF_DROP" ]; then
                  VENDORED_SKIPPED=$((VENDORED_SKIPPED + 1))
                else
                  VENDORED_KEPT="${VENDORED_KEPT}${VF}${NL}"
                fi
              done <<< "$FILES"
              FILES="${VENDORED_KEPT%"$NL"}"
              echo "::notice::Skipped $VENDORED_SKIPPED file(s) in vendored plugin dir(s): $VENDORED_LIST"
            fi
          fi

          if [ -z "$FILES" ]; then
            echo "No PHP or JS files changed — skipping PHPCS."
            exit 0
          fi
          COUNT=$(echo "$FILES" | wc -l | tr -d ' ')
          echo "Scanning $COUNT changed file(s):"
          echo "$FILES"
          # -q suppresses phpcs's progress output ('. 1 / 1 (100%)') so cs2pr
          # sees only the XML report on stdin.
          #
          # The paths reach phpcs as a file, one per line, never as arguments.
          # Through xargs a changed file named like an option (--ignore=*.php)
          # was parsed as one, a space split a name in two, a quote aborted the
          # batch, and past xargs' buffer (128 KiB of paths on the runner)
          # phpcs ran twice, so cs2pr got two XML documents and failed with
          # no annotations, clean delta or not. One run writes one report.
          PHPCS_LIST=$(mktemp)
          printf '%s\n' "$FILES" > "$PHPCS_LIST"
          # PHPCS_STANDARD_ARGS is empty or one argument
          # (--standard=WordPress-VIP-Go), passed as that one argument.
          vendor/bin/phpcs -q ${PHPCS_STANDARD_ARGS:+"$PHPCS_STANDARD_ARGS"} --report=checkstyle --file-list="$PHPCS_LIST" | cs2pr

      # Full mode takes its PATHS from the ruleset, not from the command line, so
      # without one phpcs walks the entire checkout — vendor/, node_modules/ and
      # every inherited theme the WPEngine migration dumped in. Refuse, rather than
      # open a 60,000-character issue nobody can read.
      - name: Run PHPCS full scan
        if: inputs.scan_mode == 'full' && steps.standard.outputs.ruleset == 'repo'
        run: vendor/bin/phpcs --report=full > /tmp/phpcs-output.txt 2>&1 || true

      - name: Explain why the full scan was skipped
        if: inputs.scan_mode == 'full' && steps.standard.outputs.ruleset != 'repo'
        run: |
          echo "::warning::A full scan takes its paths from a ruleset, and this repo has none."
          echo "Add a .phpcs.xml.dist here, or use the delta scan."


      - name: Create GitHub issue with full scan results
        if: inputs.scan_mode == 'full' && steps.standard.outputs.ruleset == 'repo'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date +%Y-%m-%d)
          BODY_FILE=$(mktemp)
          {
            echo "## PHPCS full scan baseline — $DATE"
            echo ""
            echo "Created by a manual \`workflow_dispatch\` full scan. Covers all files configured in \`.phpcs.xml.dist\` (\`./plugins/\`, \`./client-mu-plugins/\`, \`./themes/\`). Use as a baseline before delta-only scanning takes over."
            echo ""
            echo '```'
            head -c 60000 /tmp/phpcs-output.txt || true
            echo '```'
          } > "$BODY_FILE"
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "PHPCS full scan baseline — $DATE" \
            --body-file "$BODY_FILE"
